[project]
name = "gdpval-data"
version = "0.1.0"
description = "GDPval-style synthetic task generation pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "tenacity>=9.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.54",
    "anthropic>=0.39",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "lxml>=5.3",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.3",
    "matplotlib>=3.9",
    "rich>=13.9",
    "typer>=0.13",
    "datasets>=4.8.5",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "ipython>=8.28",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
